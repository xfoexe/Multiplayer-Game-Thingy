<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vivarium III v6.20 Multiplayer</title>
<style>
  :root{
    --ink:#0d1b1e; --moss:#1d4a4f; --bone:#e8e2d0; --pale:#9db8b4;
    --signal:#f2a65a; --child:#c77dff; --danger:#e2705f;
    --line:rgba(232,226,208,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}

  header{padding:8px 12px 7px;border-bottom:1px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;gap:10px}
  h1{margin:0;font-size:15px;font-weight:600;flex:0 0 auto}
  #pop{font-size:11px;color:var(--pale);flex:1}
  .modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .modes button{background:none;border:none;color:var(--pale);font:inherit;font-size:11px;
    padding:5px 10px;cursor:pointer}
  .modes button.on{background:var(--moss);color:var(--bone)}

  #stage{position:relative;flex:1 1 auto;min-height:140px;
    background:radial-gradient(120% 90% at 50% 8%, #17454b 0%, #0d1b1e 76%)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #povLookSurface{position:absolute;left:42%;right:0;top:0;bottom:0;z-index:10;
    pointer-events:none;touch-action:none}
  #netStatus{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:30;
    padding:6px 10px;border-radius:999px;background:#0c1b1d;color:#9db8b4;
    font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s}
  #netStatus.on{opacity:1}
  #mOnline.on{border-color:#6ee7c0;background:#12332f;color:#dffff5}
  #playerList{position:absolute;right:10px;top:44px;z-index:25;display:none;min-width:150px;max-width:210px;
    padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(8,18,20,.90);
    box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:10.5px;color:var(--pale);pointer-events:auto}
  #playerList.on{display:block}
  #playerList .plHead{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--pale);opacity:.75;margin-bottom:5px}
  #playerList .plRow{display:flex;align-items:center;gap:6px;padding:3px 0}
  #playerList .plDot{width:7px;height:7px;border-radius:50%;background:#6ee7c0;flex:0 0 auto}
  #playerList .plDot.me{background:var(--signal)}
  #playerList .plName{color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .worldTag{position:absolute;z-index:14;transform:translate(-50%,-100%);padding:2px 5px;border-radius:5px;
    background:rgba(7,15,17,.78);border:1px solid rgba(232,226,208,.18);color:#e8e2d0;
    font-size:9px;line-height:1.15;text-align:center;white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.8);display:none}
  .worldTag .player{color:#9db8b4;font-size:8px}
  .worldTag.localTag{font-size:8.5px;padding:2px 4px}
  #playerList .plMode{color:#9db8b4;font-size:9px}
  .worldTag.on{display:block}
  #povLookSurface.on{pointer-events:auto}
  #creatureDragGhost{position:absolute;display:none;pointer-events:none;z-index:4;
    padding:5px 8px;border:1px solid var(--signal);border-radius:8px;
    background:rgba(11,23,26,.88);color:var(--bone);font-size:10px}
  #hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:10.5px;
    color:rgba(157,184,180,.75);pointer-events:none}

  #panel{flex:0 0 auto;height:50%;display:flex;flex-direction:column;
    border-top:1px solid var(--line);background:#0b171a}

  #panel.collapsed{height:0;border-top:none;overflow:hidden}
  #panel.collapsed .hideable{display:none}

  #float{position:absolute;left:10px;bottom:26px;display:none;align-items:center;gap:8px;
    padding:7px 9px;border-radius:12px;background:rgba(11,23,26,.88);
    border:1px solid var(--line);max-width:75%}
  #float img{width:44px;height:44px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(160deg,#1b4a50,#102a2f)}
  #float .fi{font-size:10.5px;color:var(--pale);line-height:1.35;min-width:0}
  #float .fi b{display:block;color:var(--bone);font-size:12px}
  #float .fb{display:flex;gap:4px;margin-top:3px}
  #float .fb button{border:1px solid var(--line);background:none;color:var(--pale);
    font:inherit;font-size:10px;border-radius:6px;padding:2px 7px;cursor:pointer}
  #float .fb button.on{background:var(--moss);color:var(--bone)}

  #modal{position:fixed;inset:0;background:rgba(6,14,16,.93);display:none;
    flex-direction:column;padding:14px;z-index:20}
  #modal h2{margin:0 0 4px;font-size:14px;font-weight:600}
  #modal p{margin:0 0 8px;font-size:11.5px;color:var(--pale)}
  #modal textarea{flex:1;width:100%;min-height:90px;resize:none;background:#0b171a;
    color:var(--bone);border:1px solid var(--line);border-radius:9px;padding:9px;
    font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  #modal .mrow{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

  .pcards{display:flex;gap:6px;padding:8px 10px 0}
  .pcard{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px;
    display:flex;gap:7px;align-items:center;min-height:64px;cursor:pointer;background:transparent}
  .pcard.armed{border-color:var(--signal);border-style:dashed;background:rgba(242,166,90,.08)}
  .pcard.a{border-left:3px solid #5fd6a8}
  .pcard.b{border-left:3px solid #7fb2e8}
  .pcard img{width:52px;height:52px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(160deg,#1b4a50,#102a2f)}
  .pcard .ph{width:52px;height:52px;border-radius:8px;border:1px dashed var(--line);flex:0 0 auto}
  .pcard .info{min-width:0;font-size:10.5px;line-height:1.4;color:var(--pale)}
  .pcard .info b{display:block;font-size:12.5px;font-weight:600;color:var(--bone);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .role{font-size:9.5px;color:var(--pale);opacity:.8}

  .acts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 4px}
  button.act{flex:1 1 auto;min-width:76px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--bone);font:inherit;font-size:11.5px;cursor:pointer}
  button.act:active{background:var(--moss)}
  button.primary{background:var(--signal);color:#241304;border-color:transparent;font-weight:600;flex:2 1 110px}
  button.del{color:var(--danger);border-color:rgba(226,112,95,.4)}
  button:disabled{opacity:.32}

  .mut{display:flex;align-items:center;gap:9px;padding:2px 12px 6px;font-size:11px;color:var(--pale)}
  .mut input{flex:1;accent-color:var(--signal)}

  .tabs{display:flex;gap:14px;padding:2px 12px 0;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;color:var(--pale);font:inherit;font-size:12px;
    padding:6px 0 7px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--bone);border-bottom-color:var(--signal)}

  #scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 18px;flex:1 1 auto}

  .name{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:7px}
  .tag{font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--moss);color:var(--bone)}
  .tag.a{background:#2a5c50}.tag.b{background:#3a5470}

  .meas{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;margin-bottom:12px}
  .meas b{font-weight:400;color:var(--pale)}
  .meas span{font-family:ui-monospace,Menlo,monospace;text-align:right}
  .bar{margin-bottom:7px}
  .bar .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--pale);margin-bottom:3px}
  .bar .trk{height:5px;background:rgba(232,226,208,.1);border-radius:3px;overflow:hidden}
  .bar .fil{height:100%;background:var(--signal);border-radius:3px}
  h3{font-size:11px;font-weight:600;color:var(--pale);margin:14px 0 7px}
  .parts{display:flex;flex-wrap:wrap;gap:5px}
  .pill{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line)}
  .pill.off{color:rgba(157,184,180,.45);border-style:dashed}
  .swrow{display:flex;gap:5px;margin-bottom:10px}
  .swbig{flex:1;height:26px;border-radius:6px;position:relative}
  .swbig i{position:absolute;bottom:2px;left:4px;font-size:9px;font-style:normal;
    color:rgba(0,0,0,.6);text-shadow:0 0 3px rgba(255,255,255,.5)}

  .roster{display:flex;flex-direction:column;gap:4px}
  .rItem{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);
    border-radius:8px;font-size:12px;cursor:pointer}
  .rItem.on{border-color:var(--signal)}
  .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
  .rItem small{color:var(--pale);margin-left:auto;font-size:10.5px}

  table{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,monospace;font-size:10px}
  th{position:sticky;top:0;background:#0b171a;color:var(--pale);font-weight:500;
    text-align:left;padding:5px 3px;border-bottom:1px solid var(--line);z-index:2}
  td{padding:3px;border-bottom:1px solid rgba(232,226,208,.05);vertical-align:top}
  td.g{color:var(--pale);font-family:"Avenir Next",system-ui,sans-serif;white-space:nowrap}
  td.ch{color:#e5c9ff}
  tr.grp td{background:rgba(29,74,79,.4);color:var(--bone);font-size:10.5px;padding:5px 4px;
    font-family:"Avenir Next",system-ui,sans-serif}
  .al{opacity:.5}
  .mutflag{color:var(--signal)}
  .sw{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;vertical-align:-1px}


#savedCreaturePanel{position:fixed;inset:0;display:none;z-index:40;
  background:rgba(10,12,15,.82);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:4vh 4vw}
#savedCreaturePanel.open{display:flex}
#savedCreatureInner{width:min(980px,100%);height:min(86vh,720px);
  background:#15191d;border:1px solid #59616a;border-radius:16px;padding:16px;
  overflow:auto;color:#eee;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.savedPortrait{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;
  background:#091417;border:1px solid #46535b}
.savedPortraitMissing{display:flex;align-items:center;justify-content:center;font-size:24px}
#savedCreatureGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.savedCreature{position:relative;border:1px solid #3f474f;border-radius:12px;padding:10px;
  min-height:90px;background:#1c2227;cursor:pointer;touch-action:manipulation}
.savedCreature.selected{outline:3px solid #8bd0ff;background:#25313a}
.savedCreature .tick{position:absolute;right:8px;top:7px;width:20px;height:20px;
  border-radius:50%;border:1px solid #87929b;text-align:center;line-height:18px;font-size:13px}
.savedCreature.selected .tick{background:#8bd0ff;color:#111;border-color:#8bd0ff}
.savedCreature .name{font-weight:700}
.savedCreature .meta{opacity:.7;font-size:12px;margin-top:5px}
#savedCreatureTools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px}
#savedCreatureTools .act{min-width:110px}


/* ── free-roam creature controller ── */
#creatureController{position:absolute;inset:0;z-index:20;display:none;
  pointer-events:none;user-select:none}
#creatureController.on{display:block}
#joy{position:absolute;left:18px;bottom:22px;width:116px;height:116px;border-radius:50%;position:absolute;
  background:rgba(10,20,23,.78);border:1px solid rgba(160,210,205,.45);
  box-shadow:0 8px 30px rgba(0,0,0,.3);pointer-events:auto;touch-action:none}
#joy:before{content:"";position:absolute;inset:23px;border-radius:50%;
  border:1px dashed rgba(160,210,205,.22)}
#joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;
  border-radius:50%;background:#8ed6c8;border:2px solid rgba(255,255,255,.5);
  box-shadow:0 4px 16px rgba(0,0,0,.35);transform:translate(0,0);pointer-events:none}
#controllerActions{position:absolute;right:18px;bottom:22px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#poopBtn,#jumpBtn,#sprintBtn{width:82px;height:48px;border-radius:14px;border:1px solid rgba(210,175,135,.45);
  background:rgba(45,30,24,.92);color:#f0c9a8;font-size:22px;line-height:1;
  box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:auto;touch-action:manipulation}
#jumpBtn{background:rgba(24,45,52,.94);color:#cfece8;border-color:rgba(150,215,205,.4);font-size:15px;font-weight:700}
#sprintBtn{background:rgba(47,42,24,.94);color:#f5dfaa;border-color:rgba(235,195,105,.42);font-size:14px;font-weight:700}
#sprintBtn.on{background:rgba(118,82,22,.96);box-shadow:0 0 0 2px rgba(245,210,120,.2),0 6px 20px rgba(0,0,0,.28)}
#poopBtn:active,#jumpBtn:active,#sprintBtn:active{transform:scale(.94)}
#controllerName{max-width:150px;padding:5px 9px;border-radius:10px;
  background:rgba(8,16,18,.82);font-size:12px;color:#d7e7e4;text-align:center;
  pointer-events:none}
#controllerClose{position:absolute;right:-7px;top:-7px;width:25px;height:25px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:#162225;color:#dbe7e5;
  pointer-events:auto}
.poopPile{position:absolute;pointer-events:none}
#controllerName{position:absolute;left:50%;top:12px;transform:translateX(-50%);
  max-width:180px;padding:5px 9px;border-radius:10px;background:rgba(8,16,18,.82);
  font-size:12px;color:#d7e7e4;text-align:center;pointer-events:none}
#controllerClose{position:absolute;right:12px;top:10px;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:#162225;color:#dbe7e5;pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Vivarium</h1>
    <span id="pop">2 creatures</span>
    <div class="modes">
      <button id="mLab" class="on">Lab</button>
      <button id="mFree">Free roam</button>
      <button id="mOnline">Online</button>
    </div>
  </header>

  <div id="netStatus" aria-live="polite">offline</div>
  <div id="stage"><div id="playerList"></div><div id="povLookSurface"></div><div id="creatureDragGhost"></div><div id="hint">drag to orbit · pinch to zoom · two fingers to pan · tap a creature to select</div>
    <div id="float"></div><div id="creatureController" aria-hidden="true">
  <div id="controllerName"></div>
  <button id="controllerClose" aria-label="Stop controlling">×</button>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="controllerActions">
    <button id="jumpBtn" aria-label="Jump">JUMP</button>
    <button id="sprintBtn" aria-label="Sprint">SPRINT</button>
    <button id="poopBtn" aria-label="Poop">💩</button>
  </div>
</div>

    <div id="modal">
      <h2 id="mTitle">Transfer</h2>
      <p id="mDesc"></p>
      <textarea id="mText" spellcheck="false"></textarea>
      <div class="mrow">
        <button class="act" id="mCopy">Copy</button>
        <button class="act" id="mDownload">Download file</button>
        <button class="act" id="mShare">Share</button>
        <button class="act" id="mLoad">Load pasted</button>
        <button class="act" id="mFile">Open file…</button>
        <button class="act" id="mClose">Close</button>
      </div>
    </div></div>

  <div id="panel">
    <div class="pcards hideable">
      <div class="pcard a" id="cardA"></div>
      <div class="pcard b" id="cardB"></div>
    </div>
    <div class="acts hideable">
      <button class="act primary" id="breed">Breed</button>
      <button class="act" id="add">Add wild</button>
      <button class="act" id="labSaveCreature">Save creature</button>
      <button class="act" id="imp">Import</button>
      <button class="act" id="exp1">Export one</button>
      <button class="act" id="expAll">Export all</button>
      <button class="act del" id="del">Delete</button>
    </div>
    <label class="mut hideable">Mutation <input type="range" id="mutRate" min="0" max="30" value="4"><span id="mutVal">4%</span></label>
    <div class="tabs hideable">
      <button class="tab on" data-tab="stats">Stats</button>
      <button class="tab" data-tab="genes">Genes</button>
      <button class="tab" data-tab="roster">Roster</button>
    </div>
    <div id="scroll" class="hideable"></div>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
  </div>
</div>

<div id="savedCreaturePanel" aria-hidden="true">
  <div id="savedCreatureInner">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="margin:0">Saved creatures</h2>
      <button id="savedClose" class="act">Close</button>
    </div>
    <div id="savedCreatureTools">
      <button class="act" id="savedSelectAll">Select all</button>
      <button class="act" id="savedClear">Clear</button>
      <button class="act" id="savedExport">Export selected</button>
      <button class="act" id="savedImport">Import creatures</button>
      <input id="savedImportFile" type="file" accept="application/json,.json" multiple hidden>
    </div>
    <div id="savedCreatureGrid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════ GENE REGISTRY ═══════════ */
const G = {};
function def(part,id,d){ d.part=part; G[id]=d; }

def('Body','bodyShape',{k:'cat',dom:['round','sleek','hunched','blocky','barrel','serpentine'],l:'shape'});
def('Body','bodyLength',{k:'num',min:0.80,max:2.10,l:'length'});
def('Body','bodyWidth',{k:'num',min:0.50,max:1.35,l:'width'});
def('Body','bodyHeight',{k:'num',min:0.50,max:1.35,l:'height'});
def('Neck','neckLength',{k:'num',min:0.05,max:1.60,l:'length'});
def('Neck','neckWidth',{k:'num',min:0.20,max:0.90,l:'width'});
def('Neck','neckAngle',{k:'num',min:-0.30,max:0.85,l:'angle'});
def('Head','headShape',{k:'cat',dom:['round','wedge','long','blocky','domed','flat'],l:'shape'});
def('Head','headLength',{k:'num',min:0.45,max:1.30,l:'length'});
def('Head','headWidth',{k:'num',min:0.40,max:1.25,l:'width'});
def('Head','headHeight',{k:'num',min:0.40,max:1.25,l:'height'});
def('Snout','snoutLength',{k:'num',min:0.02,max:1.10,l:'length'});
def('Snout','snoutWidth',{k:'num',min:0.25,max:1.00,l:'width'});
def('Snout','snoutDrop',{k:'num',min:-0.20,max:0.45,l:'droop'});
def('Nose','noseType',{k:'cat',dom:['button','wide','flat','none'],l:'type'});
def('Nose','noseSize',{k:'num',min:0.06,max:0.34,l:'size'});
def('Mouth','mouthType',{k:'cat',dom:['line','jaw','beak','tusks','mandibles','none'],l:'type'});
def('Mouth','mouthSize',{k:'num',min:0.25,max:1.10,l:'size'});
def('Eyes','eyeCount',{k:'cat',dom:['2','4','6','1','0'],l:'count'});
def('Eyes','eyeSize',{k:'num',min:0.25,max:1.10,l:'size'});
def('Eyes','eyeWidth',{k:'num',min:0.55,max:1.45,l:'width'});
def('Eyes','eyeSpacing',{k:'num',min:0.30,max:0.85,l:'spacing'});
def('Eyes','eyeRise',{k:'num',min:-0.10,max:0.55,l:'height on head'});
def('Eyes','pupilShape',{k:'cat',dom:['round','slit','wide','none'],l:'pupil'});
def('Ears','earType',{k:'cat',dom:['pointed','round','long','fin','tufted','curled','frilled','none'],l:'type'});
def('Ears','earPairs',{k:'cat',dom:['1','2'],l:'pairs'});
def('Ears','earLength',{k:'num',min:0.15,max:1.40,l:'length'});
def('Ears','earWidth',{k:'num',min:0.15,max:1.10,l:'width'});
def('Ears','earAngle',{k:'num',min:-0.55,max:0.95,l:'angle'});
def('Front limbs','frontPairs',{k:'cat',dom:['1','2','0'],l:'pairs'});
def('Front limbs','frontLength',{k:'num',min:0.20,max:1.50,l:'length'});
def('Front limbs','frontThick',{k:'num',min:0.25,max:1.05,l:'thickness'});
def('Front limbs','frontBend',{k:'num',min:0.00,max:0.80,l:'joint bend'});
def('Front paws','fPawType',{k:'cat',dom:['paw','claw','hoof','fin','talon','pad','none'],l:'type'});
def('Front paws','fPawSize',{k:'num',min:0.30,max:1.30,l:'size'});
def('Front paws','fPawWidth',{k:'num',min:0.40,max:1.50,l:'width'});

const KEYS=Object.keys(G), GROUPS=[];
for(const k of KEYS) if(!GROUPS.includes(G[k].part)) GROUPS.push(G[k].part);

function randAllele(k){const d=G[k];return d.k==='cat'?d.dom[Math.floor(Math.random()*d.dom.length)]:Math.random();}
function randGenome(){const g={};for(const k of KEYS)g[k]=[randAllele(k),randAllele(k)];return g;}
function express(gn,k){
  const d=G[k],a=gn[k][0],b=gn[k][1];
  if(d.k==='cat'){for(const v of d.dom)if(a===v||b===v)return v;return d.dom[d.dom.length-1];}
  if(d.k==='hue'){
    const r1=a*Math.PI*2,r2=b*Math.PI*2;
    let m=Math.atan2((Math.sin(r1)+Math.sin(r2))/2,(Math.cos(r1)+Math.cos(r2))/2);
    if(m<0)m+=Math.PI*2;return m/(Math.PI*2)*360;
  }
  const v=d.min+((a+b)/2)*(d.max-d.min);return d.round?Math.round(v):v;
}
function phenotype(g){const p={};for(const k of KEYS)p[k]=express(g,k);return p;}
function mutate(k,val){
  const d=G[k];
  if(d.k==='cat')return d.dom[Math.floor(Math.random()*d.dom.length)];
  if(d.k==='hue')return (val+(Math.random()-0.5)*0.35+1)%1;
  return Math.min(1,Math.max(0,val+(Math.random()-0.5)*0.45));
}
function breedGenomes(mom,dad,rate){
  const child={},mutated={};
  for(const k of KEYS){
    let a=mom[k][Math.random()<0.5?0:1], b=dad[k][Math.random()<0.5?0:1];
    if(Math.random()<rate){a=mutate(k,a);mutated[k]=true;}
    if(Math.random()<rate){b=mutate(k,b);mutated[k]=true;}
    child[k]=[a,b];
  }
  return {genome:child,mutated};
}

/* ═══════════ PAINT ═══════════ */
function seedFrom(g){
  let h=2166136261;
  for(const k of KEYS)for(const a of g[k]){const s=String(a);
    for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}}
  return h>>>0;
}
function rngFrom(seed){return function(){
  seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
const clamp01=v=>Math.min(1,Math.max(0,v));
const hsl=(h,s,l)=>`hsl(${((h%360)+360)%360},${(clamp01(s)*100).toFixed(0)}%,${(clamp01(l)*100).toFixed(0)}%)`;

function drawLayer(ctx,W,H,type,colour,S,rnd){
  ctx.fillStyle=colour;
  if(type==='spots'){
    const n=Math.round(48/S);
    for(let i=0;i<n;i++){const r=(8+rnd()*20)*S,x=rnd()*W,y=rnd()*H;
      for(const ox of [0,-W,W]){ctx.beginPath();ctx.ellipse(x+ox,y,r,r*(0.6+rnd()*0.5),rnd()*3,0,7);ctx.fill();}}
  }else if(type==='rosettes'){
    const n=Math.round(26/S);
    for(let i=0;i<n;i++){const r=(11+rnd()*16)*S,x=rnd()*W,y=rnd()*H;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.save();ctx.globalCompositeOperation='destination-out';
      ctx.beginPath();ctx.arc(x,y,r*0.55,0,7);ctx.fill();ctx.restore();}
  }else if(type==='stripes'){
    const n=Math.max(3,Math.round(14/S));
    for(let i=0;i<n;i++){const w=(5+rnd()*16)*S,x=(i/n)*W+rnd()*8;
      ctx.save();ctx.translate(x,H/2);ctx.rotate((rnd()-0.5)*0.4);
      ctx.fillRect(-w/2,-H,w,H*2);ctx.restore();}
  }else if(type==='rings'){
    const n=Math.max(3,Math.round(10/S));ctx.lineWidth=5*S;ctx.strokeStyle=colour;
    for(let i=0;i<n;i++){const x=(i/n)*W+rnd()*6;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  }else if(type==='patches'){
    const n=Math.max(3,Math.round(8/S));
    for(let i=0;i<n;i++){const x=rnd()*W,y=rnd()*H,r=(30+rnd()*40)*S;
      ctx.beginPath();
      for(let a=0;a<=12;a++){const ang=a/12*Math.PI*2,rr=r*(0.6+rnd()*0.65);
        const px=x+Math.cos(ang)*rr,py=y+Math.sin(ang)*rr*0.8;
        a?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.fill();}
  }else if(type==='marble'){
    ctx.lineWidth=3*S;ctx.strokeStyle=colour;
    for(let i=0;i<18;i++){ctx.beginPath();let x=rnd()*W,y=rnd()*H;ctx.moveTo(x,y);
      for(let j=0;j<10;j++){x+=(rnd()-0.5)*60*S;y+=(rnd()-0.5)*40*S;ctx.lineTo(x,y);}
      ctx.stroke();}
  }else if(type==='belly'){
    const g=ctx.createLinearGradient(0,H*0.40,0,H);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,colour);g.addColorStop(1,colour);
    ctx.fillStyle=g;ctx.fillRect(0,H*0.40,W,H*0.60);
  }else if(type==='dorsal'){
    const g=ctx.createLinearGradient(0,0,0,H*0.55);
    g.addColorStop(0,colour);g.addColorStop(0.55,colour);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.55);
  }else if(type==='saddle'){
    const y0=H*(.12+rnd()*.2), hh2=H*(.3+rnd()*.25);
    ctx.beginPath();
    for(let i=0;i<=20;i++){
      const x=i/20*W, wob=Math.sin(i*.9+rnd())*H*.05;
      i?ctx.lineTo(x,y0+wob):ctx.moveTo(x,y0+wob);
    }
    for(let i=20;i>=0;i--){
      const x=i/20*W, wob=Math.sin(i*1.3+rnd())*H*.05;
      ctx.lineTo(x,y0+hh2+wob);
    }
    ctx.closePath();ctx.fill();
  }else if(type==='harlequin'){
    const c=Math.max(3,Math.round(9/S));
    for(let ix=0;ix<c;ix++)for(let iy=0;iy<Math.round(c*.6);iy++){
      if((ix+iy)%2)continue;
      if(rnd()<.25)continue;
      const w=W/c, h2=H/Math.round(c*.6);
      ctx.save();ctx.translate(ix*w+w/2,iy*h2+h2/2);ctx.rotate(Math.PI/4);
      ctx.fillRect(-w*.32,-h2*.32,w*.64,h2*.64);ctx.restore();
    }
  }else if(type==='reticulate'){
    ctx.strokeStyle=colour;ctx.lineWidth=3.5*S;
    const cells=Math.max(4,Math.round(11/S));
    const pts=[];
    for(let i=0;i<cells*3;i++)pts.push([rnd()*W,rnd()*H]);
    for(const [x,y] of pts){
      let near=pts.map(q=>[Math.hypot(q[0]-x,q[1]-y),q]).sort((a,b)=>a[0]-b[0]).slice(1,4);
      for(const [,q] of near){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(q[0],q[1]);ctx.stroke();}
    }
  }else if(type==='speckle'){
    const n=Math.round(500/S);
    for(let i=0;i<n;i++){const r=(1+rnd()*2.6)*S;
      ctx.beginPath();ctx.arc(rnd()*W,rnd()*H,r,0,7);ctx.fill();}
  }
}
const TEXW=288,TEXH=144;
function makeSkin(p,seed,dHue,dLight,region='body'){
  const c=document.createElement('canvas');c.width=TEXW;c.height=TEXH;
  const ctx=c.getContext('2d');
  ctx.fillStyle=hsl(p.baseHue+dHue,p.baseSat,p.baseLight+dLight);
  ctx.fillRect(0,0,TEXW,TEXH);
  const regionCode={body:11,head:23,limb:37,tail:53}[region]||7;
  const rnd=rngFrom((seed^regionCode)>>>0);
  const regionBias={
    body:[1.00,1.00], head:[.86,1.08], limb:[.68,1.18], tail:[1.16,.92]
  }[region]||[1,1];
  for(let i=1;i<=3;i++){
    ctx.save();
    const jitter=.82+rnd()*.34;
    ctx.globalAlpha=Math.min(1,p['pat'+i+'Alpha']*regionBias[0]*jitter);
    drawLayer(ctx,TEXW,TEXH,p['pat'+i+'Type'],
      hsl(p['pat'+i+'Hue']+dHue+(rnd()-.5)*14,p['pat'+i+'Sat'],p['pat'+i+'Light']+dLight+(rnd()-.5)*.06),
      p['pat'+i+'Scale']*regionBias[1]*(.90+rnd()*.22),rnd);
    ctx.restore();
  }
  // Region-specific accent bands make the same offspring genome read
  // differently on different body parts without changing the genome schema.
  if(region==='limb' && rnd()<.72){
    ctx.save();ctx.globalAlpha=.18+rnd()*.16;
    const g=ctx.createLinearGradient(0,0,0,TEXH);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.45,hsl(p.baseHue+p.limbHue,p.baseSat,p.baseLight+p.limbLight));
    g.addColorStop(.55,hsl(p.baseHue+p.limbHue,p.baseSat,p.baseLight+p.limbLight));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,TEXH*.35,TEXW,TEXH*.3);ctx.restore();
  }
  if(region==='tail' && rnd()<.62){
    ctx.save();ctx.globalAlpha=.22+rnd()*.14;ctx.fillStyle=hsl(p.pat2Hue+18,p.pat2Sat,p.pat2Light);
    const n=4+Math.floor(rnd()*4);
    for(let i=0;i<n;i++){const x=i/n*TEXW;ctx.fillRect(x,0,TEXW/n*.38,TEXH);}ctx.restore();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;return t;
}

/* ═══════════ BODY BUILDER ═══════════ */
const SPH=new THREE.SphereGeometry(1,18,12), CYL=new THREE.CylinderGeometry(1,1,1,9),
      CON=new THREE.ConeGeometry(1,1,8), BOX=new THREE.BoxGeometry(1,1,1),
      TOR=new THREE.TorusGeometry(.7,.28,6,12);

function buildCreature(genome){
  const p=phenotype(genome), seed=seedFrom(genome), disposables=[];
  const matCache={};
  function skinMat(dh,dl,region){
    const kk=region+':'+Math.round(dh/7)+':'+Math.round(dl*14);
    if(matCache[kk]) return matCache[kk];
    const t=makeSkin(p,seed,dh,dl,region);disposables.push(t);
    const m=new THREE.MeshStandardMaterial({map:t,roughness:.82,metalness:.02});
    disposables.push(m);matCache[kk]=m;return m;
  }
  const mBody=skinMat(0,0,'body'), mHead=skinMat(p.headHue,p.headLight,'head'),
        mLimb=skinMat(p.limbHue,p.limbLight,'limb'), mTail=skinMat(p.tailHue,p.tailLight,'tail');
  const mExtra=new THREE.MeshStandardMaterial({
    color:new THREE.Color(hsl(p.baseHue,p.baseSat*0.4,clamp01(p.baseLight+p.extraLight))),roughness:.55});
  const mDark=new THREE.MeshStandardMaterial({color:0x140f0e,roughness:.45});
  const mEye=new THREE.MeshStandardMaterial({
    color:new THREE.Color(hsl(p.eyeHue,p.eyeSat,p.eyeLight)),roughness:.2});
  disposables.push(mExtra,mDark,mEye);

  const root=new THREE.Group();
  const rig={legs:[],tails:[],ears:[],head:null,body:null,ants:[],wings:[]};

  const sm={round:[1,1,1],sleek:[.85,.85,1.2],hunched:[1.05,1.15,.95],blocky:[1.1,1.05,1],
    barrel:[1.3,1.25,.85],serpentine:[.62,.62,1.75]}[p.bodyShape];
  const bw=p.bodyWidth*sm[0], bh=p.bodyHeight*sm[1], bl=p.bodyLength*sm[2];
  const legLen=Math.max(p.frontLength,p.backLength);
  const stand=0.30+legLen*0.95+bh*0.15;

  const body=new THREE.Mesh(SPH,mBody);
  body.scale.set(bw,bh,bl);body.position.y=stand;
  if(p.bodyShape==='hunched')body.rotation.x=-0.1;
  root.add(body);rig.body=body;

  const frontZ=bl*0.85, neckBaseY=stand+bh*0.30;
  const headPos=new THREE.Vector3(0,
    neckBaseY+p.neckLength*Math.sin(0.6+p.neckAngle),
    frontZ+p.neckLength*Math.cos(0.6+p.neckAngle));
  if(p.neckLength>0.06){
    const neck=new THREE.Mesh(CYL,mBody);
    neck.scale.set(p.neckWidth*0.45,p.neckLength+0.18,p.neckWidth*0.45);
    neck.position.set(0,(neckBaseY+headPos.y)/2,(frontZ+headPos.z)/2);
    neck.lookAt(headPos);neck.rotateX(Math.PI/2);root.add(neck);
  }
  const headGrp=new THREE.Group();headGrp.position.copy(headPos);
  root.add(headGrp);rig.head=headGrp;

  const hm={round:[1,1,1],wedge:[1.15,.85,1.15],long:[.8,.85,1.45],blocky:[1.15,1.1,1],
    domed:[1,1.35,.9],flat:[1.25,.62,1.15]}[p.headShape];
  const hw=p.headWidth*hm[0]*.55, hh=p.headHeight*hm[1]*.55, hl=p.headLength*hm[2]*.55;
  const head=new THREE.Mesh(SPH,mHead);head.scale.set(hw,hh,hl);headGrp.add(head);

  if(p.snoutLength>0.06){
    const sn=new THREE.Mesh(SPH,mHead);
    sn.scale.set(hw*p.snoutWidth*.85,hh*.62,p.snoutLength*.62);
    sn.position.set(0,-hh*p.snoutDrop,hl*.55+p.snoutLength*.45);headGrp.add(sn);
  }
  if(p.noseType!=='none'){
    const nz=hl*.5+p.snoutLength*1.02, n=new THREE.Mesh(SPH,mDark);
    if(p.noseType==='button')n.scale.setScalar(p.noseSize);
    else if(p.noseType==='wide')n.scale.set(p.noseSize*1.8,p.noseSize*.85,p.noseSize*.7);
    else n.scale.set(p.noseSize*1.3,p.noseSize*1.2,p.noseSize*.35);
    n.position.set(0,-hh*p.snoutDrop+hh*.05,nz);headGrp.add(n);
  }
  if(p.mouthType!=='none'){
    const my=-hh*p.snoutDrop-hh*.34, mz=hl*.42+p.snoutLength*.6;
    if(p.mouthType==='line'){
      const m=new THREE.Mesh(BOX,mDark);
      m.scale.set(hw*p.mouthSize*.9,.025,p.snoutLength*.5+hl*.3);
      m.position.set(0,my,mz);headGrp.add(m);
    }else if(p.mouthType==='jaw'){
      const m=new THREE.Mesh(SPH,mHead);
      m.scale.set(hw*p.mouthSize*.7,hh*.22,p.snoutLength*.5+hl*.4);
      m.position.set(0,my-hh*.1,mz);headGrp.add(m);
    }else if(p.mouthType==='beak'){
      const m=new THREE.Mesh(CON,mExtra);
      m.scale.set(hw*p.mouthSize*.6,p.mouthSize*.75,hh*.5);
      m.rotation.x=Math.PI/2;m.position.set(0,my+hh*.15,mz+p.mouthSize*.3);headGrp.add(m);
    }else if(p.mouthType==='mandibles'){
      for(const sx of [-1,1]){
        const m=new THREE.Mesh(CON,mExtra);
        m.scale.set(.045,p.mouthSize*.9,.045);
        m.rotation.set(-Math.PI/2.1,0,-sx*.85);
        m.position.set(sx*hw*.55,my+hh*.1,mz+p.mouthSize*.22);headGrp.add(m);}
    }else{
      for(const sx of [-1,1]){
        const m=new THREE.Mesh(CON,mExtra);
        m.scale.set(.05,p.mouthSize*.55,.05);m.rotation.x=Math.PI*.92;
        m.position.set(sx*hw*.5,my,mz);headGrp.add(m);}
    }
  }
  const ec=parseInt(p.eyeCount,10);
  if(ec>0){
    const rows={1:[[.05,.8]],2:[[0,.75]],4:[[.10,.72],[-.18,.90]],
                6:[[.16,.66],[0,.86],[-.20,1.0]]}[ec];
    const r=.20*p.eyeSize*(ec===1?1.5:1);
    const sides=ec===1?[0]:[-1,1];
    for(const [yo,zo] of rows)for(const sx of sides){
      const ey=hh*(p.eyeRise+yo*1.2), ez=hl*zo*.82;
      const e=new THREE.Mesh(SPH,mEye);
      e.scale.set(r*p.eyeWidth,r,r);
      e.position.set(sx*hw*p.eyeSpacing*1.5,ey,ez);headGrp.add(e);
      if(p.pupilShape!=='none'){
        const pu=new THREE.Mesh(SPH,mDark);
        const ps={round:[.42,.42],slit:[.16,.7],wide:[.7,.3]}[p.pupilShape];
        pu.scale.set(r*ps[0]*p.eyeWidth,r*ps[1],r*.4);
        pu.position.set(sx*hw*p.eyeSpacing*1.5+sx*r*.18,ey,ez+r*.72);headGrp.add(pu);
      }
    }
  }
  if(p.earType!=='none'){
    const pairs=parseInt(p.earPairs,10);
    for(let i=0;i<pairs;i++)for(const sx of [-1,1]){
      const piv=new THREE.Group();
      piv.position.set(sx*hw*.72,hh*.72,-i*hl*.5+hl*.1);
      headGrp.add(piv);rig.ears.push(piv);
      let ear;
      if(p.earType==='pointed'){ear=new THREE.Mesh(CON,mHead);
        ear.scale.set(p.earWidth*.26,p.earLength*.8,p.earWidth*.18);ear.position.y=p.earLength*.4;}
      else if(p.earType==='long'){ear=new THREE.Mesh(SPH,mHead);
        ear.scale.set(p.earWidth*.14,p.earLength*.62,p.earWidth*.2);ear.position.y=p.earLength*.55;}
      else if(p.earType==='fin'){ear=new THREE.Mesh(CON,mHead);
        ear.scale.set(p.earWidth*.45,p.earLength*.6,.035);ear.position.y=p.earLength*.3;}
      else if(p.earType==='tufted'){ear=new THREE.Mesh(CON,mHead);
        ear.scale.set(p.earWidth*.2,p.earLength*.7,p.earWidth*.16);ear.position.y=p.earLength*.35;
        const tuft=new THREE.Mesh(SPH,mExtra);tuft.scale.setScalar(p.earWidth*.13);
        tuft.position.y=p.earLength*.72;piv.add(tuft);}
      else if(p.earType==='curled'){ear=new THREE.Mesh(TOR,mHead);
        ear.scale.setScalar(p.earLength*.34+.06);ear.position.y=p.earLength*.3;
        ear.rotation.y=Math.PI/2;}
      else if(p.earType==='frilled'){
        ear=new THREE.Group();
        for(let f=-2;f<=2;f++){
          const b=new THREE.Mesh(CON,mHead);
          b.scale.set(p.earWidth*.1,p.earLength*(.5-Math.abs(f)*.07),.03);
          b.position.y=p.earLength*.25;b.rotation.z=f*.32;ear.add(b);
        }}
      else{ear=new THREE.Mesh(SPH,mHead);
        ear.scale.set(p.earWidth*.32,p.earWidth*.32,.06);ear.position.y=p.earLength*.24;}
      ear.rotation.z=-sx*p.earAngle;piv.add(ear);
    }
  }
  if(p.hornType==='crown'){
    const n=7;
    for(let i=0;i<n;i++){
      const a=(i/(n-1)-.5)*2.2;
      const h=new THREE.Mesh(CON,mExtra);
      const f=1-Math.abs(i/(n-1)-.5)*1.2;
      h.scale.set(p.hornWidth*.7,p.hornLength*(.45+f*.75),p.hornWidth*.7);
      h.position.set(Math.sin(a)*hw*1.15,hh*.8+p.hornLength*.3*f,Math.cos(a)*hl*.35);
      h.rotation.z=-a*.55;headGrp.add(h);
    }
  }else if(p.hornType==='antlers'){
    for(const sx of [-1,1]){
      const beam=new THREE.Mesh(CON,mExtra);
      beam.scale.set(p.hornWidth*.75,p.hornLength*1.15,p.hornWidth*.75);
      beam.position.set(sx*hw*1.1,hh*.85+p.hornLength*.5,hl*.1);
      beam.rotation.z=-sx*.42;headGrp.add(beam);
      for(let b=0;b<3;b++){
        const tine=new THREE.Mesh(CON,mExtra);
        tine.scale.set(p.hornWidth*.4,p.hornLength*(.42-b*.07),p.hornWidth*.4);
        tine.position.set(sx*(hw*1.1+p.hornLength*(.2+b*.16)),
                          hh*.85+p.hornLength*(.55+b*.32),hl*.1+(b-1)*.12);
        tine.rotation.z=-sx*(.9+b*.15);headGrp.add(tine);
      }
    }
  }else if(p.hornType==='spiral'){
    for(const sx of [-1,1]){
      for(let i=0;i<7;i++){
        const b=new THREE.Mesh(SPH,mExtra);
        const f=i/6;
        b.scale.setScalar(p.hornWidth*(1.05-f*.6));
        b.position.set(sx*(hw*1.15+Math.sin(f*5)*p.hornLength*.24),
                       hh*.8+f*p.hornLength*1.35,
                       hl*.1+Math.cos(f*5)*p.hornLength*.24);
        headGrp.add(b);
      }
    }
  }else if(p.hornType!=='none'){
    const sets={pair:[[-.5,0]],single:[[0,0]],quad:[[-.55,0],[-.28,-.45]],swept:[[-.5,0]]}[p.hornType];
    for(const [xo,zo] of sets){
      const xs=xo===0?[0]:[xo,-xo];
      for(const sx of xs){
        const h=new THREE.Mesh(CON,mExtra);
        h.scale.set(p.hornWidth,p.hornLength,p.hornWidth);
        h.position.set(sx*hw*1.3,hh*.85+p.hornLength*.35,hl*zo+hl*.15);
        h.rotation.z=-Math.sign(sx||1)*(p.hornType==='swept'?.75:.25);
        if(p.hornType==='swept')h.rotation.x=-.5;
        headGrp.add(h);
      }
    }
  }
  if(p.antType!=='none'){
    for(const sx of [-1,1]){
      const piv=new THREE.Group();
      piv.position.set(sx*hw*.45,hh*.85,hl*.2);piv.rotation.z=-sx*p.antAngle;
      headGrp.add(piv);rig.ants.push(piv);
      const st=new THREE.Mesh(CYL,mExtra);
      st.scale.set(.028,p.antLength,.028);st.position.y=p.antLength*.5;piv.add(st);
      if(p.antType==='bulb'){
        const b=new THREE.Mesh(SPH,mExtra);
        b.scale.setScalar(.09+p.antLength*.07);b.position.y=p.antLength;piv.add(b);
      }else if(p.antType==='eyestalk'){
        const b=new THREE.Mesh(SPH,mEye);
        b.scale.setScalar(.1+p.antLength*.06);b.position.y=p.antLength;piv.add(b);
        const pu=new THREE.Mesh(SPH,mDark);
        pu.scale.setScalar(.045+p.antLength*.025);
        pu.position.set(0,p.antLength,.075+p.antLength*.05);piv.add(pu);
      }else if(p.antType==='feathered'){
        for(let i=1;i<=4;i++){
          const f=new THREE.Mesh(CON,mExtra);
          f.scale.set(.02,.13,.02);f.position.y=p.antLength*(i/5);
          f.position.x=(i%2?1:-1)*.06;f.rotation.z=(i%2?-1:1)*.9;piv.add(f);}
      }
    }
  }
  function addLimbSet(pairs,zBase,zStep,len,thick,bend,ft,fs,fw){
    for(let i=0;i<pairs;i++){
      const z=(zBase+i*zStep)*bl;
      for(const sx of [-1,1]){
        const hip=new THREE.Group();
        hip.position.set(sx*bw*.72,stand-bh*.32,z);
        root.add(hip);
        rig.legs.push({node:hip,phase:i*1.1+(sx>0?Math.PI:0)+(zBase>0?0:.6)});
        const ul=(len+.32)*.55;
        const up=new THREE.Mesh(CYL,mLimb);
        up.scale.set(thick*.17,ul,thick*.17);up.position.y=-ul/2;hip.add(up);
        const knee=new THREE.Group();knee.position.y=-ul;knee.rotation.x=bend*.8;hip.add(knee);
        const lo=new THREE.Mesh(CYL,mLimb);
        lo.scale.set(thick*.14,ul,thick*.14);lo.position.y=-ul/2;knee.add(lo);
        if(ft!=='none'){
          const fg=new THREE.Group();fg.position.y=-ul;fg.rotation.x=-bend*.8;knee.add(fg);
          if(ft==='pad'){
            const f=new THREE.Mesh(SPH,mLimb);
            f.scale.set(fw*.2,fs*.08,fs*.24);f.position.set(0,0,fs*.06);fg.add(f);
          }else if(ft==='talon'){
            for(const cx of [-1,0,1]){
              const c=new THREE.Mesh(CON,mExtra);
              c.scale.set(.028,fs*.28,.028);c.rotation.x=-Math.PI/2.4;
              c.rotation.z=cx*.3;
              c.position.set(cx*fw*.08,-.01,fs*.16);fg.add(c);
            }
          }else if(ft==='hoof'){
            const f=new THREE.Mesh(CYL,mExtra);
            f.scale.set(fw*.11,fs*.16,fw*.11);f.position.y=-fs*.06;fg.add(f);
          }else if(ft==='fin'){
            const f=new THREE.Mesh(CON,mLimb);
            f.scale.set(fw*.3,fs*.42,.04);f.rotation.x=-Math.PI/2;
            f.position.set(0,0,fs*.16);fg.add(f);
          }else{
            const f=new THREE.Mesh(SPH,mLimb);
            f.scale.set(fw*.13,fs*.09,fs*.2);f.position.set(0,0,fs*.05);fg.add(f);
            if(ft==='claw')for(const cx of [-1,0,1]){
              const c=new THREE.Mesh(CON,mExtra);
              c.scale.set(.022,.09,.022);c.rotation.x=-Math.PI/2.1;
              c.position.set(cx*fw*.07,-.01,fs*.21);fg.add(c);}
          }
        }
      }
    }
  }
  const fp=parseInt(p.frontPairs,10), bp=parseInt(p.backPairs,10);
  addLimbSet(fp,.52,-.34,p.frontLength,p.frontThick,p.frontBend,p.fPawType,p.fPawSize,p.fPawWidth);
  addLimbSet(bp,-.55,.34,p.backLength,p.backThick,p.backBend,p.bPawType,p.bPawSize,p.bPawWidth);

  if(p.tailType!=='none'){
    const tc=parseInt(p.tailCount,10);
    for(let t=0;t<tc;t++){
      const chain=[];let parent=root;const segs=6;
      for(let i=0;i<segs;i++){
        const seg=new THREE.Group();
        if(i===0)seg.position.set(tc===2?(t?.22:-.22):0,stand+bh*.1,-bl*.92);
        else{seg.position.set(0,0,-p.tailLength*.3);seg.rotation.x=p.tailArc*.35;}
        parent.add(seg);chain.push(seg);
        const f=1-i/segs;const m=new THREE.Mesh(SPH,mTail);
        if(p.tailType==='whip')m.scale.set(p.tailThick*(.13*f+.02),p.tailThick*(.13*f+.02),p.tailLength*.19);
        else if(p.tailType==='puff')m.scale.setScalar(i===segs-1?p.tailLength*.38*p.tailThick+.1:p.tailThick*(.1*f+.035));
        else if(p.tailType==='fan')m.scale.set(.045,p.tailThick*(.3*(i/segs)+.07),p.tailLength*.18);
        else if(p.tailType==='spade')m.scale.set(i===segs-1?p.tailThick*.28:p.tailThick*(.1*f+.03),i===segs-1?.05:p.tailThick*(.1*f+.03),p.tailLength*.19);
        else if(p.tailType==='club')m.scale.setScalar(i>=segs-2?p.tailThick*(.19+.1*(i-segs+2)):p.tailThick*(.09*f+.03));
        else if(p.tailType==='plume'){
          m.scale.set(.035,p.tailThick*(.09*f+.03),p.tailLength*.17);
          for(let q=-1;q<=1;q+=2){
            const fea=new THREE.Mesh(CON,mTail);
            fea.scale.set(.03,p.tailThick*(.22+.16*(i/segs)),p.tailLength*.12);
            fea.rotation.set(-Math.PI/2,0,q*.5);
            fea.position.set(q*.05,0,-p.tailLength*.2);
            seg.add(fea);
          }
        }
        else if(p.tailType==='forked'){
          m.scale.set(p.tailThick*(.1*f+.03),p.tailThick*(.1*f+.03),p.tailLength*.19);
          if(i===segs-1)for(let q=-1;q<=1;q+=2){
            const pr=new THREE.Mesh(CON,mTail);
            pr.scale.set(.05,p.tailLength*.42,.05);
            pr.rotation.set(-Math.PI/1.9,0,q*.55);
            pr.position.set(q*.09,0,-p.tailLength*.3);
            seg.add(pr);
          }
        }
        else m.scale.setScalar(p.tailThick*(.12*f+.05));
        m.position.z=-p.tailLength*.15;seg.add(m);parent=seg;
      }
      rig.tails.push(chain);
    }
  }
  if(p.spikeType!=='none'){
    const n=p.spikeCount;
    if(p.spikeType==='frill'){
      for(let i=0;i<n;i++){
        const a=(i/(n-1)-.5)*Math.PI*1.1;
        const s=new THREE.Mesh(CON,mExtra);
        s.scale.set(.04,p.spikeSize*1.5,.09);
        s.position.set(Math.sin(a)*hw*1.5, stand+headPos.y-stand+Math.cos(a)*hh*1.4, headPos.z-hl*.4);
        s.rotation.z=-a;root.add(s);
      }
    }else if(p.spikeType==='shell'){
      const sh2=new THREE.Mesh(SPH,mExtra);
      sh2.scale.set(bw*1.06,bh*(.55+p.spikeSize),bl*.92);
      sh2.position.set(0,stand+bh*.18,-bl*.05);
      root.add(sh2);
    }else if(p.spikeType==='sail'){
      for(let i=0;i<n;i++){
        const f=Math.sin((i+.5)/n*Math.PI);
        const z=(i/Math.max(1,n-1)*1.7-.85)*bl;
        const s2=new THREE.Mesh(BOX,mExtra);
        s2.scale.set(.04,p.spikeSize*(.4+f*3.1),bl*(1.7/n)*.85);
        s2.position.set(0,stand+bh*.9+p.spikeSize*(.2+f*1.55),z);
        root.add(s2);
      }
    }else for(let i=0;i<n;i++){
      const f=Math.sin((i+1)/(n+1)*Math.PI);
      const z=(i/(n-1)*1.7-.85)*bl;let s;
      if(p.spikeType==='plates'){s=new THREE.Mesh(BOX,mExtra);s.scale.set(.05,p.spikeSize*(.5+f),p.spikeSize*.7);}
      else{s=new THREE.Mesh(CON,mExtra);s.scale.set(.055,p.spikeSize*(.5+f*1.1),.075);}
      s.position.set(0,stand+bh*.92+p.spikeSize*.3*f,z);root.add(s);
    }
  }
  if(p.wingType!=='none'){
    for(const sx of [-1,1]){
      const shoulder=new THREE.Group();
      shoulder.position.set(sx*bw*.72, stand+bh*p.wingSet, bl*.18);
      shoulder.rotation.z=-sx*.35;
      root.add(shoulder);
      rig.wings.push({node:shoulder,side:sx});
      if(p.wingType==='membrane'){
        const w=new THREE.Mesh(CON,mLimb);
        w.scale.set(p.wingSize*.9,p.wingSpan*1.6,.03);
        w.rotation.set(0,0,-sx*1.35);
        w.position.set(sx*p.wingSpan*.8,p.wingSize*.15,0);
        shoulder.add(w);
        for(let r2=0;r2<3;r2++){
          const rib=new THREE.Mesh(CYL,mExtra);
          rib.scale.set(.022,p.wingSpan*1.5,.022);
          rib.rotation.z=-sx*(1.15+r2*.22);
          rib.position.set(sx*p.wingSpan*.72,p.wingSize*(.1-r2*.12),0);
          shoulder.add(rib);
        }
      }else if(p.wingType==='feathered'){
        for(let q=0;q<5;q++){
          const f=new THREE.Mesh(CON,mLimb);
          const t2=q/4;
          f.scale.set(p.wingSize*.16,p.wingSpan*(1.5-t2*.45),.025);
          f.rotation.set(0,0,-sx*(1.25+t2*.3));
          f.position.set(sx*p.wingSpan*.7,p.wingSize*(.22-t2*.3),-t2*p.wingSize*.28);
          shoulder.add(f);
        }
      }else{
        const w=new THREE.Mesh(SPH,mLimb);
        w.scale.set(p.wingSpan*.75,p.wingSize*.22,p.wingSize*.62);
        w.position.set(sx*p.wingSpan*.6,p.wingSize*.1,0);
        shoulder.add(w);
      }
    }
  }

  const shGeo=new THREE.CircleGeometry(1,16);
  const shMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.2});
  disposables.push(shGeo,shMat);
  const sh=new THREE.Mesh(shGeo,shMat);
  sh.rotation.x=-Math.PI/2;sh.position.y=.012;sh.scale.set(bw*1.15,bl*1.05,1);
  root.add(sh);

  root.userData={rig,p,stand,disposables,dims:{bw,bh,bl,hw,hh,hl,headY:headPos.y}};
  return root;
}

/* ═══════════ STATS ═══════════ */
function statsFor(genome,mesh){
  const p=phenotype(genome), d=mesh.userData.dims, stand=mesh.userData.stand;
  const legs=(parseInt(p.frontPairs,10)+parseInt(p.backPairs,10))*2;
  const tails=p.tailType==='none'?0:parseInt(p.tailCount,10);
  const eyes=parseInt(p.eyeCount,10);
  const ears=p.earType==='none'?0:parseInt(p.earPairs,10)*2;
  const shoulder=stand+d.bh*.9;
  const headTop=d.headY+d.hh+(p.hornType!=='none'?p.hornLength*.8:0);
  const bodyLen=d.bl*2;
  const totalLen=bodyLen+d.hl*2+p.neckLength+(tails?p.tailLength*1.6:0);
  const mass=d.bw*d.bh*d.bl*7.4+legs*p.frontThick*.4+d.hw*d.hh*d.hl*3;
  const S=v=>Math.round(Math.max(0,Math.min(100,v)));
  const legAvg=(p.frontLength+p.backLength)/2;
  return {
    measure:{
      'Height at shoulder':shoulder.toFixed(2),'Height overall':headTop.toFixed(2),
      'Body length':bodyLen.toFixed(2),'Length nose to tail':totalLen.toFixed(2),
      'Estimated mass':mass.toFixed(2),'Body width':(d.bw*2).toFixed(2),
      'Head width':(d.hw*2).toFixed(2),'Neck length':p.neckLength.toFixed(2)
    },
    bars:{
      Speed:S(legAvg*46+legs*3-mass*7+(tails?6:0)),
      Power:S(mass*11+p.frontThick*22+(p.hornType!=='none'?14:0)),
      Agility:S(70-mass*10+tails*11+legs*2.5+(p.bodyShape==='sleek'?12:0)
               +(p.wingType!=='none'?p.wingSpan*16:0)),
      Senses:S(eyes*9+ears*6+p.earLength*13+(p.antType!=='none'?22:0)+p.eyeSize*14),
      Defence:S((p.spikeType!=='none'?32+p.spikeSize*38:6)+(p.hornType!=='none'?18:0)+mass*5),
      Bite:S({none:4,line:14,jaw:44,beak:38,tusks:56}[p.mouthType]+d.hl*30+p.mouthSize*16)
    },
    parts:[
      ['head',1],['neck',p.neckLength>.1?1:0],['body',1],['eyes',eyes],
      ['nose',p.noseType==='none'?0:1],['mouth',p.mouthType==='none'?0:1],['ears',ears],
      ['horns',p.hornType==='none'?0:1],['antennae',p.antType==='none'?0:2],
      ['front limbs',parseInt(p.frontPairs,10)*2],['back limbs',parseInt(p.backPairs,10)*2],
      ['front paws',p.fPawType==='none'?0:parseInt(p.frontPairs,10)*2],
      ['back feet',p.bPawType==='none'?0:parseInt(p.backPairs,10)*2],
      ['tails',tails],['ridge',p.spikeType==='none'?0:1],['wings',p.wingType==='none'?0:2]
    ],
    legs, mass, p
  };
}

/* ═══════════ NAMES ═══════════ */
const SYL1=['va','mo','ki','tel','sur','ny','bra','ol','zen','fi','har','qu','lo','ry','em','ash','du','pel'];
const SYL2=['ra','lin','dor','sha','ven','mi','to','ker','sil','ba','nu','wen','lo','ta','rix','en'];
const SYL3=['','n','th','s','ka','del','wyn','x','ro'];
function makeName(rnd){
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const n=pick(SYL1)+pick(SYL2)+pick(SYL3);
  return n[0].toUpperCase()+n.slice(1);
}

/* ── BIG PARKOUR SETPIECES ──

   chunky stones, slabs and stepped boulders with real collision footprints. */
const parkourMat=new THREE.MeshStandardMaterial({color:0x173c42,roughness:.96});

function addParkourBox(x,z,w,d,h,rot=0){
  const m=new THREE.Mesh(BOX,parkourMat);
  m.scale.set(w,h,d);
  m.position.set(x,h*.5,z);
  m.rotation.y=rot;
  scene.add(m);
  window._parkourRocks.push({
    x,z,rx:w*.5,rz:d*.5,top:h,
    shape:'box',rot
  });
  return m;
}

function addParkourBoulder(x,z,rx,rz,h,rot=0){
  const m=new THREE.Mesh(SPH,parkourAccent);
  m.scale.set(rx,h,rz);
  m.position.set(x,h*.92,z);
  m.rotation.y=rot;
  scene.add(m);
  window._parkourRocks.push({
    x,z,rx,rz,top:h*1.92,
    shape:'ellipse',rot
  });
  return m;
}

function netSpawnPeer(msg){

  const incomingMode=msg.mode==='free'?'free':'lab';

  if(p && genomeKey && p.genomeKey===genomeKey){

    if(msg.creatureName)p.creatureName=msg.creatureName;
    if(msg.creatureCount!==undefined)p.creatureCount=Math.max(0,Number(msg.creatureCount)||0);
    if(msg.x!==undefined)p.tx=Number(msg.x)||0;
    if(msg.z!==undefined)p.tz=Number(msg.z)||0;
    if(msg.heading!==undefined)p.th=Number(msg.heading)||0;
    if(msg.jumpY!==undefined)p.tj=Number(msg.jumpY)||0;
    updatePeerVisibility(p);
    return p;
  }

  if(!genomeKey){
    if(!p){
      p={id:msg.id,name:msg.name||'Player',genome:null,genomeKey:null,mesh:null,tag:null,
        creatureName:msg.creatureName||'Creature',creatureCount:Math.max(0,Number(msg.creatureCount)||0),
        x:0,z:0,heading:0,jumpY:0,tx:0,tz:0,th:0,tj:0,
        speed:0,last:performance.now(),mode:incomingMode,free:incomingMode==='free'};
      netPeers.set(msg.id,p);
    }else{
      p.name=msg.name||p.name;
      p.mode=incomingMode;
      p.free=incomingMode==='free';
      if(msg.creatureCount!==undefined)p.creatureCount=Math.max(0,Number(msg.creatureCount)||0);
    }

  if(p && p.mesh)scene.remove(p.mesh);

  const mesh=buildCreature(msg.genome);

  mesh.position.set(Number(msg.x)||0,Number(msg.jumpY)||0,Number(msg.z)||0);
  mesh.rotation.y=Number(msg.heading)||0;

    creatureCount:Math.max(0,Number(msg.creatureCount)||0),

function netConnect(){
  if(netSocket && netSocket.readyState===1){netDisconnect();return;}
  netManualDisconnect=false;
  const url=netUrl();
  if(!url)return;
  try{netSocket=new WebSocket(url);}catch(err){netStatus('could not connect',true);return;}
  netSetButton(true);
  netStatus('connecting…',true);
  netSocket.onopen=()=>{
    netName=prompt('Name for this multiplayer test?',netName||'Player')||'Player';
    netLastCount=-1; netAnnouncedFree=null;
    netSend({type:'hello',name:netName,mode,creatureCount:pop.length});
    renderPlayerList();
    netStatus('online',true);
    netStartKeepalive();
    setTimeout(()=>{if(netSocket&&netSocket.readyState===1)netStatus('online',false)},1800);
  };
  netSocket.onmessage=e=>{
    let msg;try{msg=JSON.parse(e.data)}catch(_){return;}
    if(msg.type==='welcome'){
      netId=msg.id;
      for(const st of (msg.players||[]))if(st.id!==netId)netSpawnPeer(st);
      renderPlayerList();
    }else if(msg.type==='presence'){
      if(msg.id===netId)return;
      const p=netSpawnPeer(msg);
      if(p){p.name=msg.name||p.name;p.mode=msg.mode||p.mode||'lab';p.free=msg.mode==='free';updatePeerVisibility(p);}
      renderPlayerList(); syncNetworkCount();
    }else if(msg.type==='state'){
      if(msg.id===netId)return;
      const p=netSpawnPeer(msg);
      if(p){p.tx=Number(msg.x)||0;p.tz=Number(msg.z)||0;p.th=Number(msg.heading)||0;p.tj=Number(msg.jumpY)||0;
        p.name=msg.name||p.name;p.creatureName=msg.creatureName||p.creatureName||'Creature';
        if(msg.creatureCount!==undefined)p.creatureCount=Math.max(0,Number(msg.creatureCount)||0);
        p.mode=msg.mode||'free';p.free=p.mode!=='lab';updatePeerVisibility(p);}
      syncNetworkCount();
    }else if(msg.type==='poop'){
      if(msg.id!==netId) createPoopAt(msg.x,msg.z,45,false);
    }else if(msg.type==='leave')netRemovePeer(msg.id);
  };
  netSocket.onerror=()=>netStatus('connection error',true);
  netSocket.onclose=()=>{
    clearInterval(netKeepaliveTimer);
    netSocket=null;netId=null;
    for(const p of netPeers.values()){if(p.mesh)scene.remove(p.mesh);if(p.tag)p.tag.remove();}
    netPeers.clear();netSetButton(false);netStatus('offline',false);
    if(!netManualDisconnect){
      clearTimeout(netReconnectTimer);
      netReconnectTimer=setTimeout(()=>{
        if(!netManualDisconnect && !netSocket) netConnect();
      },2500);
    }
  };
}

/* ── creature movement variation + simple calls ── */
function geneNumber(entity, key, fallback=0.5){
  const g = entity?.genes;
  if(!g) return fallback;
  const v = g[key];
  if(typeof v === 'number') return v;
  if(typeof v === 'string'){
    let h=0; for(let i=0;i<v.length;i++) h=((h<<5)-h)+v.charCodeAt(i)|0;
    return (Math.abs(h)%1000)/999;
  }
  return fallback;
}
function creatureVoice(entity){
  const a = geneNumber(entity,'voice',geneNumber(entity,'pattern',0.5));
  const b = geneNumber(entity,'color',0.5);
  const c = geneNumber(entity,'size',0.5);
  const bank = [
    ['chirp',520,0.08],['peep',760,0.055],['trill',980,0.12],
    ['click',260,0.045],['chirrup',610,0.11],['whistle',1180,0.09],
    ['croak',190,0.12],['warble',430,0.16],['tweet',880,0.07]
  ];
  const i=Math.floor((a*7+b*3+c*2)*bank.length)%bank.length;
  return bank[i];
}
let audioCtx=null;
function callCreature(entity){
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const [kind,base,dur]=creatureVoice(entity);
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const now=audioCtx.currentTime;
    const wobble=1+(geneNumber(entity,'pattern',0.5)-0.5)*0.35;
    osc.type = geneNumber(entity,'mechanics',0.5)>0.66 ? 'square' : 'sine';
    osc.frequency.setValueAtTime(base*wobble,now);
    osc.frequency.exponentialRampToValueAtTime(base*(0.72+geneNumber(entity,'voice',0.5)*0.5),now+dur);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.055,now+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now+dur+0.02);
  }catch(_){}
}
function maybeCall(entity, force=false){
  if(force){ callCreature(entity); return; }
  const chance=0.00055 + geneNumber(entity,'voice',0.5)*0.001;
  if(Math.random()<chance) callCreature(entity);
}
function varyRoam(entity){
  if(!entity?.roam) return;
  const g=geneNumber(entity,'pattern',0.5);
  entity.roam.speed = 0.8 + g*1.7;
  entity.roam.turnBias = (g-0.5)*0.7;
  // Only give a newly-created/uninitialised creature an initial pause.
  // Existing pause/targets are left alone so movement can continue naturally.
  if(!Number.isFinite(entity.roam.pause)) entity.roam.pause = Math.random()*(0.5+g*2.0);
  if(!Number.isFinite(entity.roam.tx)) entity.roam.tx = entity.roam.x;
  if(!Number.isFinite(entity.roam.tz)) entity.roam.tz = entity.roam.z;
}

function creatureAtClient(x,y){
  const rect = el.getBoundingClientRect();
  const nd = new THREE.Vector2(
    ((x-rect.left)/rect.width)*2-1,
    -((y-rect.top)/rect.height)*2+1
  );
  raycaster.setFromCamera(nd,camera);
  const meshes = pop.map(e=>e.mesh).filter(Boolean);
  const hits = raycaster.intersectObjects(meshes,true);
  if(!hits.length) return null;
  return hits[0].object.userData.owner || null;
}

function moveCreatureToPointer(e){
  if(!creatureDrag) return;
  const rect = el.getBoundingClientRect();
  const nd = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2-1,
    -((e.clientY-rect.top)/rect.height)*2+1
  );
  raycaster.setFromCamera(nd,camera);

  // Project the pointer onto the vivarium floor.
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const hit = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane,hit)) return;

  const ecr = creatureDrag.entity;
  ecr.roam.x = Math.max(-24,Math.min(24,hit.x));
  ecr.roam.z = Math.max(-24,Math.min(24,hit.z));
  ecr.roam.tx = ecr.roam.x;
  ecr.roam.tz = ecr.roam.z;
  ecr.roam.speed = Math.min(ecr.maxSpeed, Math.max(.8, ecr.maxSpeed*.65));
  ecr.roam.pause = 0;
  ecr.mesh.position.x = ecr.roam.x;
  ecr.mesh.position.z = ecr.roam.z;
}

function jumpCreature(){
  const e=controlledCreature;
  if(!e || mode!=='free') return;
  const r=e.roam;
  if(r.jumpY>.04 || r.jumpV>0) return;
  const agility=Math.max(0,Math.min(1,(e.stats?.bars?.Agility||50)/100));
  r.jumpV=10.0+agility*5.0;
}

function createPoopAt(x,z,life=45,playSound=false){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x6b3b22,roughness:.95});
  const m1=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),mat);
  const m2=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),mat);
  const m3=new THREE.Mesh(new THREE.SphereGeometry(.10,10,8),mat);
  m1.scale.y=.7; m2.scale.y=.72; m3.scale.y=.7;
  m1.position.y=.13; m2.position.set(.07,.30,0); m3.position.set(-.03,.43,0);
  g.add(m1,m2,m3);
  g.position.set(Number(x)||0,0,Number(z)||0);
  g.rotation.y=Math.random()*Math.PI*2;
  scene.add(g);
  if(!window._poops) window._poops=[];
  window._poops.push({mesh:g,life});
  if(playSound){
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const o=audioCtx.createOscillator(), gain=audioCtx.createGain(), now=audioCtx.currentTime;
      o.type='sine'; o.frequency.setValueAtTime(150,now); o.frequency.exponentialRampToValueAtTime(70,now+.09);
      gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(.045,now+.008);
      o.connect(gain).connect(audioCtx.destination); o.start(now); o.stop(now+.13);
    }catch(_){}
  }
}
function poopCreature(){
  const e=controlledCreature;

  createPoopAt(e.roam.x,e.roam.z,45,true);
  netSend({type:'poop',x:e.roam.x,z:e.roam.z});
}

function beginCreatureDrag(e,entity){
  creatureDrag = {
    entity,
    pointerId:e.pointerId,
    startX:e.clientX,
    startY:e.clientY,
    moved:false,
    held:false
  };
  controlPointerId=e.pointerId;
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  selected = entity;
  applyPins();
  syncUI();

  // Long-press in Free roam enters direct creature control.
  if(mode==='free'){
    clearTimeout(controlHoldTimer);
    controlHoldTimer=setTimeout(()=>{
      if(!creatureDrag || creatureDrag.pointerId!==e.pointerId || creatureDrag.moved) return;
      creatureDrag.held=true;
      startCreatureControl(entity,e.pointerId);
      dragGhost.style.display='none';
    },420);
  }
}

function endCreatureDrag(e){
  if(!creatureDrag || creatureDrag.pointerId!==e.pointerId) return;
  const d=creatureDrag;
  clearTimeout(controlHoldTimer); controlHoldTimer=null;
  creatureDrag=null;
  dragGhost.style.display='none';
  try{ el.releasePointerCapture(e.pointerId); }catch(_){}

  if(d.held){
    // Releasing the original long-press does not close the controller.
    controlPointerId=null;
    return;
  }

  if(!d.moved){
    selected=d.entity;
    pickAt(e.clientX,e.clientY);
  }else{
    d.entity.roam.pause=.8+Math.random()*1.2;
    d.entity.roam.tx=d.entity.roam.x;
    d.entity.roam.tz=d.entity.roam.z;
    selected=d.entity;
    applyPins(); syncUI();
  }
}

el.addEventListener('pointerdown',e=>{

  const hit=creatureAtClient(e.clientX,e.clientY);
  if(!hit) return;
  e.preventDefault();
  beginCreatureDrag(e,hit);

el.addEventListener('pointermove',e=>{
  if(controlledCreature && e.pointerId===controlPointerId) return;
  if(!creatureDrag || creatureDrag.pointerId!==e.pointerId) return;
  e.preventDefault();

  const dx=e.clientX-creatureDrag.startX;
  const dy=e.clientY-creatureDrag.startY;
  if(!creatureDrag.moved && Math.hypot(dx,dy)<5) return;

  clearTimeout(controlHoldTimer); controlHoldTimer=null;
  creatureDrag.moved=true;
  moveCreatureToPointer(e);

  dragGhost.style.display='block';
  const r=el.getBoundingClientRect();
  dragGhost.style.left=(e.clientX-r.left+12)+'px';
  dragGhost.style.top=(e.clientY-r.top+12)+'px';
  dragGhost.textContent='picked up · release to drop';
});

el.addEventListener('pointercancel',e=>{
  clearTimeout(controlHoldTimer); controlHoldTimer=null;
  if(creatureDrag && creatureDrag.pointerId===e.pointerId){
    creatureDrag=null; dragGhost.style.display='none';
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  }
});


// ── unified tablet camera gestures ──
// Pointer Events are used for both orbit and pinch so Android does not
// run a pointer gesture and a separate touch gesture on top of each other.
// Normal view: one finger = orbit, two fingers = pinch + pan.
// Controlled view: right side one finger = look, two fingers = POV pinch.
function clearCameraPointers(){
  camPointers.clear();
  cameraDragPointer=null;
  pinch=0;
  panning=false;
}

el.addEventListener('pointerdown',e=>{
  if(controlledCreature) return;
  if(mode!=='free' && mode!=='lab') return;
  if(creatureDrag) return;

  // If this starts on a creature, leave it to the creature picker.
  if(creatureAtClient(e.clientX,e.clientY)) return;

  camPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(camPointers.size===1){
    cameraDragPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  }else if(camPointers.size===2){
    cameraDragPointer=null;
    const pts=[...camPointers.values()];
    pinch=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    panning=true;
    e.preventDefault();
  }
},{passive:false});

el.addEventListener('pointermove',e=>{
  if(controlledCreature) return;
  if(!camPointers.has(e.pointerId)) return;
  camPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(camPointers.size>=2 && pinch){
    const pts=[...camPointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(d>0){
      dist=Math.max(4,Math.min(70,dist*(pinch/d)));
      pinch=d;
    }
    const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    if(!window._camLastMid) window._camLastMid=mid;
    const mdx=mid.x-window._camLastMid.x, mdy=mid.y-window._camLastMid.y;
    panBy(mdx,mdy);
    window._camLastMid=mid;
    e.preventDefault();
    return;
  }

  if(cameraDragPointer && e.pointerId===cameraDragPointer.id){
    const dx=e.clientX-cameraDragPointer.x, dy=e.clientY-cameraDragPointer.y;
    cameraDragPointer.x=e.clientX; cameraDragPointer.y=e.clientY;
    rotY-=dx*.008;
    rotX=Math.max(-.95,Math.min(.95,rotX-dy*.006));
    e.preventDefault();
  }
},{passive:false});

function endCameraPointer(e){
  camPointers.delete(e.pointerId);
  if(camPointers.size<2){
    pinch=0; panning=false;
    window._camLastMid=null;
  }
  if(cameraDragPointer && cameraDragPointer.id===e.pointerId) cameraDragPointer=null;
  if(camPointers.size===1 && !controlledCreature){
    const [id,p]=[...camPointers.entries()][0];
    cameraDragPointer={id,x:p.x,y:p.y};
  }
}
el.addEventListener('pointerup',endCameraPointer);
el.addEventListener('pointercancel',endCameraPointer);

el.addEventListener('wheel',e=>{
  if(controlledCreature) return;
  e.preventDefault();
  dist=Math.max(4,Math.min(70,dist+e.deltaY*.014));
},{passive:false});

// Controlled POV gets its own pointer surface.
// This surface never shares the orbit camera's rotY/rotX state.
povLookSurface.addEventListener('pointerdown',e=>{
  if(!controlledCreature || mode!=='free') return;
  povPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(povPointers.size===1){
    povLookPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
    try{povLookSurface.setPointerCapture(e.pointerId)}catch(_){}
  }else if(povPointers.size===2){
    const pts=[...povPointers.values()];
    povPinchStart={
      dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),
      zoom:povDistance
    };
    povLookPointer=null;
    e.preventDefault();
  }
  e.preventDefault();
},{passive:false});

povLookSurface.addEventListener('pointermove',e=>{
  if(!controlledCreature || !povPointers.has(e.pointerId)) return;
  povPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(povPointers.size>=2 && povPinchStart){
    const pts=[...povPointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    povDistance=Math.max(.12,Math.min(12,
      povPinchStart.zoom-(d-povPinchStart.dist)*.012));
    e.preventDefault();
    return;
  }

  if(povLookPointer && povLookPointer.id===e.pointerId){
    const dx=e.clientX-povLookPointer.x, dy=e.clientY-povLookPointer.y;
    povLookPointer.x=e.clientX; povLookPointer.y=e.clientY;
    povYaw-=dx*.010;
    povPitch=Math.max(-1.15,Math.min(1.15,povPitch-dy*.008));
    rotY=povYaw;
    rotX=povPitch;
    e.preventDefault();
  }
},{passive:false});

function endPovPointer(e){
  povPointers.delete(e.pointerId);
  if(povLookPointer && povLookPointer.id===e.pointerId) povLookPointer=null;
  if(povPointers.size<2) povPinchStart=null;
  if(povPointers.size===1 && controlledCreature){
    const [id,p]=[...povPointers.entries()][0];
    povLookPointer={id,x:p.x,y:p.y};
    try{povLookSurface.setPointerCapture(id)}catch(_){}
  }
}
povLookSurface.addEventListener('pointerup',endPovPointer);
povLookSurface.addEventListener('pointercancel',endPovPointer);

function panBy(dx,dy){
  const k=dist*.0022;
  const right=new THREE.Vector3(Math.cos(rotY),0,-Math.sin(rotY));
  const fwd=new THREE.Vector3(Math.sin(rotY),0,Math.cos(rotY));
  target.addScaledVector(right,-dx*k);
  target.addScaledVector(fwd,-dy*k);
  target.x=Math.max(-FIELD,Math.min(FIELD,target.x));
  target.z=Math.max(-FIELD,Math.min(FIELD,target.z));
}

const raycaster=new THREE.Raycaster();
function pickAt(cx,cy){
  const r=el.getBoundingClientRect();
  const nd=new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  raycaster.setFromCamera(nd,camera);
  const hits=raycaster.intersectObjects(pop.map(e=>e.mesh),true);
  if(hits.length){
    let o=hits[0].object;
    while(o&&!o.userData.owner) o=o.parent;
    if(o&&o.userData.owner){
      const e=o.userData.owner;
      if(armed){ assignSlot(armed,e); armed=null; }
      else {
        selected=e;
        if(mode==='free' && controlledCreature && controlledCreature!==e){
          startCreatureControl(e,null);
        }
      }
      syncUI();
    }
  }
}

/* portrait render — frames one creature alone into a small image */
const PORTSIZE=200;
const portTarget=new THREE.WebGLRenderTarget(PORTSIZE,PORTSIZE);
const portCam=new THREE.PerspectiveCamera(34,1,.1,120);
const portCanvas=document.createElement('canvas');
portCanvas.width=PORTSIZE;portCanvas.height=PORTSIZE;
function makePortrait(e){
  if(e.portrait && e.portrait.startsWith('data:image/')) return e.portrait;

  const W=220,H=220,c=document.createElement('canvas');
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const p=phenotype(e.genome||e.mesh?.userData?.genome||{});

  // Tiny illustrated profile based directly on the creature's expressed genetics.
  // It is deliberately 2D so it works reliably on tablets without another WebGL context.
  const hue=Number.isFinite(p.baseHue)?p.baseHue:160;
  const sat=Number.isFinite(p.baseSat)?p.baseSat:65;
  const light=Number.isFinite(p.baseLight)?p.baseLight:48;
  const body=`hsl(${hue},${sat}%,${light}%)`;
  const darker=`hsl(${hue},${Math.max(25,sat-10)}%,${Math.max(18,light-15)}%)`;
  const eye=`hsl(${(hue+205)%360},${Math.min(90,sat+15)}%,${Math.max(15,light-30)}%)`;

  // soft habitat-like background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#122c30');bg.addColorStop(1,'#071518');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2,H/2+8);

  const scale=Math.max(.72,Math.min(1.28,
    (Number(p.bodyLen)||1)/2.0));
  ctx.scale(scale,scale);

  // tail
  ctx.strokeStyle=darker;ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-42,24);ctx.quadraticCurveTo(-78,45,-88,12);ctx.stroke();

  // wings / fins: restrained and slightly asymmetrical
  const wing=String(p.wing||p.wings||'').toLowerCase();
  if(wing!=='none' && wing!=='absent'){
    ctx.fillStyle=darker;
    ctx.beginPath();ctx.ellipse(-47,-4,31,13,-.45,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(47,-4,31,13,.45,0,Math.PI*2);ctx.fill();
  }

  // body
  ctx.fillStyle=body;
  ctx.beginPath();ctx.ellipse(0,20,58,40,0,0,Math.PI*2);ctx.fill();

  // head
  const headSize=Math.max(30,Math.min(52,36+(Number(p.headSize)||.5)*16));
  ctx.beginPath();ctx.ellipse(0,-25,headSize,headSize*.88,0,0,Math.PI*2);ctx.fill();

  // ears/horns/antennae according to broad genetic categories
  ctx.fillStyle=darker;
  const ear=String(p.ear||p.ears||p.headFeature||'').toLowerCase();
  if(ear!=='none' && ear!=='absent'){
    ctx.beginPath();ctx.moveTo(-25,-51);ctx.lineTo(-39,-78);ctx.lineTo(-10,-59);ctx.fill();
    ctx.beginPath();ctx.moveTo(25,-51);ctx.lineTo(39,-78);ctx.lineTo(10,-59);ctx.fill();
  }

  // eyes
  ctx.fillStyle=eye;
  ctx.beginPath();ctx.ellipse(-15,-28,7,9,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(15,-28,7,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5f5f0';
  ctx.beginPath();ctx.arc(-13,-30,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(17,-30,2.2,0,Math.PI*2);ctx.fill();

  // little mouth/beak
  ctx.strokeStyle=darker;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,-10,8,.15,Math.PI-.15);ctx.stroke();

  // pattern hints derived from the actual expressed pattern genes
  for(let i=1;i<=3;i++){
    const a=Number(p['pat'+i+'Alpha'])||0;
    if(a<=.08) continue;
    const ph=Number(p['pat'+i+'Hue']);
    ctx.fillStyle=`hsla(${Number.isFinite(ph)?ph:hue+40},75%,65%,${Math.min(.65,a)})`;
    ctx.beginPath();ctx.arc((i-2)*22,7+i*8,5+i*2,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
  e.portrait=c.toDataURL('image/png');
  return e.portrait;
}

/* ═══════════ LOOP ═══════════ */
const clock=new THREE.Clock();
function lerpAngle(a,b,t){
  let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;
  if(d<-Math.PI)d+=Math.PI*2;
  return a+d*t;
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;

  for(const e of pop){
    const r=e.roam, m=e.mesh, {rig,p,stand}=m.userData;

    if(mode==='lab'&&e.pinned){
      const s=LAB_SLOTS[e.pinned];
      r.x+=(s.x-r.x)*Math.min(1,dt*2.4);
      r.z+=(s.z-r.z)*Math.min(1,dt*2.4);
      r.heading=lerpAngle(r.heading,s.ry,Math.min(1,dt*2.4));
      r.speed*= (1-Math.min(1,dt*3));
    }else if(controlledCreature===e && mode==='free'){
      const jx=joyX, jy=joyY;
      const mag=Math.min(1,Math.hypot(jx,jy));
      if(mag>.05){
        // Joystick is camera-relative: up means away from the camera.
        // Restore the pre-6.7 directional mapping; keep joystick magnitude.
        // Horizontal direction swapped back: left/right now match your brain again.
        const moveX=-Math.cos(rotY)*jx + Math.sin(rotY)*(-jy);
        const moveZ=Math.sin(rotY)*jx + Math.cos(rotY)*(-jy);
        const len=Math.hypot(moveX,moveZ)||1;
        r.heading=lerpAngle(r.heading,Math.atan2(moveX/len,moveZ/len),Math.min(1,dt*9));
        const sprintMult=sprintActive?3.0:1;
        r.speed+=(e.maxSpeed*mag*sprintMult-r.speed)*Math.min(1,dt*7);
        r.x+=Math.sin(r.heading)*r.speed*dt;
        r.z+=Math.cos(r.heading)*r.speed*dt;
        r.x=Math.max(-FIELD,Math.min(FIELD,r.x)); r.z=Math.max(-FIELD,Math.min(FIELD,r.z));
      }else{
        r.speed+=(0-r.speed)*Math.min(1,dt*8);
      }
      r.tx=r.x; r.tz=r.z;
    }else{
      if(r.pause>0){ r.pause-=dt; r.speed+=(0-r.speed)*Math.min(1,dt*2.5); }
      else{
        const dx=r.tx-r.x, dz=r.tz-r.z, d=Math.hypot(dx,dz);
        if(d<.6){
          newTarget(r);
          const g=geneNumber(e,'pattern',.5);
          r.pause=.15+Math.random()*(.65+g*1.25);
        }
        else{
          r.heading=lerpAngle(r.heading,Math.atan2(dx,dz),Math.min(1,dt*1.9));
          r.speed+=(e.maxSpeed-r.speed)*Math.min(1,dt*1.6);
        }
      }
      r.x+=Math.sin(r.heading)*r.speed*dt;
      r.z+=Math.cos(r.heading)*r.speed*dt;
      const rad=Math.hypot(r.x,r.z);
      if(rad>FIELD){ r.x*=FIELD/rad; r.z*=FIELD/rad; newTarget(r); }
    }

    // Lightweight jump/landing physics for Free roam parkour.
    if(r.jumpV>0 || r.jumpY>0){
      r.jumpV-=12.5*dt;
      r.jumpY+=r.jumpV*dt;
      if(r.jumpY<=0){
        r.jumpY=0; r.jumpV=0;
      }
    }
    // Land on the tops of the larger parkour rocks while falling.
    if(r.jumpV<=0){
      let best=0;
      for(const rock of window._parkourRocks||[]){
        const dx=r.x-rock.x, dz=r.z-rock.z;
        const nx=dx/rock.rx, nz=dz/rock.rz;
        if(nx*nx+nz*nz<.72 && r.jumpY<=rock.top+.45 && r.jumpY>=rock.top-.8){
          best=Math.max(best,rock.top);
        }
      }
      if(best>0 && r.jumpY<=best){
        r.jumpY=best; r.jumpV=0;
      }
    }
    // Once a creature walks beyond a rock's footprint, it falls off.
    if(r.jumpY>0){
      let supported=false;
      for(const rock of window._parkourRocks||[]){
        const dx=r.x-rock.x, dz=r.z-rock.z;
        const nx=dx/rock.rx, nz=dz/rock.rz;
        if(nx*nx+nz*nz<.78 && Math.abs(r.jumpY-rock.top)<.12){supported=true;break;}
      }
      if(!supported && r.jumpV===0) r.jumpV=-1.2;
    }

    m.position.set(r.x,r.jumpY,r.z);
    m.rotation.y=r.heading;

    const mv=r.speed/Math.max(.01,e.maxSpeed);
    if(mv>.025) r.walkPhase+=dt*(2.2+mv*9);
    r.bob+=dt*(1.6+mv*5);
    rig.body.position.y=stand+Math.sin(r.bob*1.6)*(.02+mv*.05);
    rig.body.rotation.z=Math.sin(r.walkPhase)*mv*.05;
    if(rig.head){
      rig.head.rotation.y=Math.sin(t*.55+e.id)*(.3-mv*.22);
      rig.head.rotation.x=Math.sin(t*.85+e.id)*.06+mv*.08;
    }
    rig.legs.forEach(L=> L.node.rotation.x=mv>.025 ? Math.sin(r.walkPhase+L.phase)*(mv*.5) : 0);
    rig.tails.forEach((chain,ti)=>chain.forEach((s,j)=>{
      if(j===0)return;
      s.rotation.y=Math.sin(t*2+mv*3-j*.5+e.id+ti)*(.14+mv*.14);
    }));
    rig.ears.forEach((ear,j)=>{
      const tw=Math.max(0,Math.sin(t*.75+e.id*2+j));
      ear.rotation.x=-Math.pow(tw,8)*.45;
    });
    rig.ants.forEach((a,j)=>a.rotation.x=Math.sin(t*1.4+j+e.id)*.16);
    rig.wings.forEach(w=>{
      const flap=Math.sin(t*(r.wingRate||.55)+(r.wingPhase||0))*(r.wingAmp||.04);
      w.node.rotation.z=-w.side*(.35+flap);
    });
  }

  function markRing(rg,e,scaleBoost){
    if(!e){rg.visible=false;return;}
    rg.visible=true;
    const d=e.mesh.userData.dims;
    const s=Math.max(d.bw,d.bl)*1.25+scaleBoost;
    rg.position.set(e.roam.x,.02,e.roam.z);
    rg.scale.setScalar(s);
  }
  markRing(ringA,slotA,.05);
  markRing(ringB,slotB,.05);
  markRing(ring,selected,.28);

  if(window._poops){
    for(let i=window._poops.length-1;i>=0;i--){
      const q=window._poops[i];
      q.life-=dt;
      if(q.life<=0){
        scene.remove(q.mesh);
        q.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();});
        window._poops.splice(i,1);
      }
    }
  }

  const nowNet=performance.now();
  netBroadcastState(nowNet);
  for(const p of netPeers.values()){
    const oldX=p.x, oldZ=p.z;
    p.x+=(p.tx-p.x)*Math.min(1,dt*12);
    p.z+=(p.tz-p.z)*Math.min(1,dt*12);
    p.heading=lerpAngle(p.heading,p.th,Math.min(1,dt*10));
    p.jumpY+=(p.tj-p.jumpY)*Math.min(1,dt*12);
    if(p.mesh){
      p.mesh.position.set(p.x,p.jumpY,p.z);
      p.mesh.rotation.y=p.heading;
    }
    p.speed=Math.hypot(p.x-oldX,p.z-oldZ)/Math.max(dt,.001);
    updateWorldTag(p.tag,p.mesh,p.creatureName,p.name,p.mesh.visible&&p.free);
    const rr=p.mesh&&p.mesh.userData.rig;
    if(rr){
      const mv=Math.min(1,p.speed/2.5);
      if(mv>.025) rr.legs.forEach(L=>L.node.rotation.x=Math.sin(nowNet*.012*(2+mv*5)+L.phase)*(mv*.5));
      else rr.legs.forEach(L=>L.node.rotation.x=0);
      rr.body.position.y=(p.mesh.userData.stand||0)+Math.sin(nowNet*.003)*(.02+mv*.04);
    }
  }

  for(const e of pop){
    const tag=ensureLocalTag(e);
    updateWorldTag(tag,e.mesh,e.name,null,mode==='free' && e.mesh.visible);
  }

  if(controlledCreature && mode==='free'){
    const e=controlledCreature, r=e.roam, rig=e.mesh.userData.rig;
    const head=new THREE.Vector3();
    if(rig && rig.head) rig.head.getWorldPosition(head);
    else head.set(r.x,r.jumpY+1.25,r.z);
    head.y+=.08;

    const cp=Math.cos(povPitch), sp=Math.sin(povPitch);
    const fx=Math.sin(povYaw)*cp, fy=sp, fz=Math.cos(povYaw)*cp;
    const d=Math.max(.12,povDistance);

    camera.position.set(
      head.x-fx*d,
      head.y-fy*d+Math.max(0,d*.10),
      head.z-fz*d
    );
    camera.fov=78;
    camera.updateProjectionMatrix();
    camera.lookAt(head.x+fx*8,head.y+fy*8,head.z+fz*8);

    // First person hides the creature; zooming out reveals it naturally.
    e.mesh.visible=d>.85;
  }else{
    camera.fov=60;
    camera.updateProjectionMatrix();
    camera.position.set(
      target.x+Math.sin(rotY)*dist*Math.cos(rotX),
      target.y+Math.sin(rotX)*dist,
      target.z+Math.cos(rotY)*dist*Math.cos(rotX));
    camera.lookAt(target);
  }
  renderer.render(scene,camera);
}
