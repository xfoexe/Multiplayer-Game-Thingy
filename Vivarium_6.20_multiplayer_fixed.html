/* ── transfer: works even where blob downloads are blocked ── */
const modal=document.getElementById('modal'), mText=document.getElementById('mText'),
      mTitle=document.getElementById('mTitle'), mDesc=document.getElementById('mDesc'),
      mCopy=document.getElementById('mCopy'), mDownload=document.getElementById('mDownload'),
      mShare=document.getElementById('mShare'), mLoad=document.getElementById('mLoad'),
      mFileBtn=document.getElementById('mFile'), mClose=document.getElementById('mClose'),
      fileInput=document.getElementById('file');
let modalMode='export', pendingName='vivarium.json';

const slug=s2=>s2.toLowerCase().replace(/[^a-z0-9]+/g,'-');
function openExport(name,obj){
  modalMode='export'; pendingName=name;
  mTitle.textContent='Export';
  mDesc.textContent='Copy this text, or download it. Paste it back through Import on any device.';
  mText.value=JSON.stringify(obj,null,2);
  mText.readOnly=false;
  mCopy.style.display=mDownload.style.display='';
  mShare.style.display=navigator.share?'':'none';
  mLoad.style.display=mFileBtn.style.display='none';
  modal.style.display='flex';
}
function openImport(){
  modalMode='import';
  mTitle.textContent='Import';
  mDesc.textContent='Paste creature JSON below and press Load, or open a saved file.';
  mText.value=''; mText.readOnly=false;
  mCopy.style.display=mDownload.style.display=mShare.style.display='none';
  mLoad.style.display=mFileBtn.style.display='';
  modal.style.display='flex';
}
mClose.onclick=()=>{ modal.style.display='none'; };
mCopy.onclick=async()=>{
  const text=mText.value;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      throw new Error('Clipboard API unavailable');
    }
    mCopy.textContent='Copied';
  }catch(err){
    try{
      mText.focus(); mText.select();
      const ok=document.execCommand('copy');
      mCopy.textContent=ok?'Copied':'Select all + copy';
      if(window.getSelection) window.getSelection().removeAllRanges();
    }catch(e){
      mText.focus(); mText.select();
      mCopy.textContent='Select all + copy';
    }
  }
  setTimeout(()=>mCopy.textContent='Copy',1800);
};
mDownload.onclick=()=>{
  try{
    const url=URL.createObjectURL(new Blob([mText.value],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=pendingName;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    mDownload.textContent='Saved';
  }catch(err){ mDownload.textContent='Blocked — use Copy'; }
  setTimeout(()=>mDownload.textContent='Download file',2200);
};
mShare.onclick=async()=>{
  try{
    const file=new File([mText.value],pendingName,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))
      await navigator.share({files:[file],title:pendingName});
    else await navigator.share({title:pendingName,text:mText.value});
  }catch(err){}
};
mLoad.onclick=()=>{ ingest(mText.value); };
mFileBtn.onclick=()=>{
  fileInput.value='';
  fileInput.click();
};
fileInput.onchange=async()=>{
  const f=fileInput.files&&fileInput.files[0];
  if(!f)return;
  try{
    const text=await f.text();
    ingest(text);
  }catch(err){
    mDesc.textContent='Could not read that file: '+err.message;
  }finally{
    fileInput.value='';
  }
};
function ingest(text){
  let obj;
  try{ obj=JSON.parse(text); }
  catch(err){ mDesc.textContent='That is not valid JSON — check the paste is complete.'; return; }
  const found=collectCreatures(obj);
  if(!found.length){ mDesc.textContent='No creatures found in that data.'; return; }
  let added=0;
  for(const c of found){
    if(pop.length>=MAXPOP) break;
    const slots=[[-4.4,0],[4.4,0],[0,3.6]];
    const pos=slots[added%slots.length];
    const e=spawn(normaliseGenome(c.genome),pos[0],pos[1],c.origin||'imported');
    if(e){
      e.roam.pause=3.0;
      e.roam.tx=e.roam.x; e.roam.tz=e.roam.z;
      if(c.name)e.name=c.name; if(c.parents)e.parents=c.parents;
      added++; selected=e;
    }
  }
  modal.style.display='none';
  applyPins(); syncUI();
  flash(added<found.length
    ? `Imported ${added} of ${found.length} — population is full.`
    : `Imported ${added} creature${added===1?'':'s'}.`);
}
document.getElementById('imp').onclick=openImport;
document.getElementById('exp1').onclick=()=>{
  if(!selected)return;
  openExport(`creature-${slug(selected.name)}.json`,{
    format:'vivarium-creature', version:2, geneCount:KEYS.length,
    name:selected.name, origin:selected.origin,
    parents:selected.parents||null, genome:selected.genome });
};
document.getElementById('expAll').onclick=()=>{
  openExport('vivarium-population.json',{
    format:'vivarium-population', version:2, geneCount:KEYS.length,
    population:pop.map(e=>({name:e.name,origin:e.origin,parents:e.parents||null,genome:e.genome})) });
};
function collectCreatures(obj){
  const out=[];
  const isGenome=g=>g&&typeof g==='object'&&(Array.isArray(g.bodyLength)||Array.isArray(g[KEYS[0]]));
  const add=(x,meta={})=>{
    if(!x||typeof x!=='object')return;
    if(x.genome&&isGenome(x.genome)) out.push({name:x.name||meta.name,origin:x.origin||meta.origin,parents:x.parents||meta.parents,genome:x.genome});
    else if(isGenome(x)) out.push({genome:x,name:meta.name,origin:meta.origin,parents:meta.parents});
  };
  if(Array.isArray(obj)) obj.forEach(o=>add(o)||out.push(...collectCreatures(o)));
  else if(obj&&typeof obj==='object'){
    if(Array.isArray(obj.population)) obj.population.forEach(pp=>add(pp));
    if(Array.isArray(obj.creatures)) obj.creatures.forEach(pp=>add(pp));
    if(Array.isArray(obj.savedCreatures)) obj.savedCreatures.forEach(pp=>add(pp));
    add(obj);
    if(obj.parentA) add(obj.parentA);
    if(obj.parentB) add(obj.parentB);
    if(obj.offspring) add(obj.offspring);
    if(obj.data && typeof obj.data==='object') out.push(...collectCreatures(obj.data));
  }
  // De-duplicate the same genome object when a wrapper exposes it in multiple places.
  const seen=new Set();
  return out.filter(c=>{
    const key=JSON.stringify(c.genome);
    if(seen.has(key))return false; seen.add(key); return true;
  });
}
function normaliseGenome(src){
  const g={};
  for(const k of KEYS){
    const v=src[k];
    const ok=Array.isArray(v)&&v.length===2&&v.every(x=>
      G[k].k==='cat'?G[k].dom.includes(x):(typeof x==='number'&&x>=0&&x<=1));
    g[k]= ok ? [v[0],v[1]] : [randAllele(k),randAllele(k)];
  }
  return g;
}

function flash(msg){
  hintEl.textContent=msg;

  flashTimer=setTimeout(syncUI,2800);

      <div class="name">${c.name||c.species||'Creature '+(i+1)}</div>
      <div class="meta">saved creature · ${c.genome?'genetic profile':'invalid entry'}</div>`;
    card.onclick=()=>{savedSelected.has(i)?savedSelected.delete(i):savedSelected.add(i);renderSaved();};
    savedGrid.appendChild(card);
  });
}
function openSaved(){
  let changed=false;
  savedCreatures.forEach(c=>{
    if(!c.genome) return;
    if(c.portrait && c.portrait.startsWith('data:image/')) return;
    const live=pop.find(e=>JSON.stringify(e.genome)===JSON.stringify(c.genome));
    if(live){
      c.portrait=makePortrait(live);
      changed=true;
    }
  });
  if(changed) persistSaved();
  savedPanel.classList.add('open');
  savedPanel.setAttribute('aria-hidden','false');
  renderSaved();
}
document.getElementById('savedClose').onclick=()=>{
  savedPanel.classList.remove('open');
  savedPanel.setAttribute('aria-hidden','true');
};
savedPanel.addEventListener('click',e=>{
  if(e.target===savedPanel){
    savedPanel.classList.remove('open');
    savedPanel.setAttribute('aria-hidden','true');
  }
});
document.getElementById('savedSelectAll').onclick=()=>{savedCreatures.forEach((_,i)=>savedSelected.add(i));renderSaved();};
document.getElementById('savedClear').onclick=()=>{savedSelected.clear();renderSaved();};
document.getElementById('savedExport').onclick=()=>{
  const data=savedCreatures.filter((_,i)=>savedSelected.has(i));
  if(!data.length)return;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=data.length===1?'creature.json':'creatures.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById('savedImport').onclick=()=>savedInput.click();
savedInput.onchange=async e=>{
  for(const f of e.target.files){
    try{
      const d=JSON.parse(await f.text());
      const arr=Array.isArray(d)?d:[d];
      savedCreatures.push(...arr);
    }catch(_){}
  }
  persistSaved();renderSaved();savedInput.value='';
};

// Add a "Save creature" button and a "Saved" button to the page without disturbing existing UI.
const creatureButton=document.createElement('button');
creatureButton.id='mCreatures';
creatureButton.type='button';
creatureButton.textContent='Creatures';
creatureButton.onclick=openSaved;
document.querySelector('.modes').appendChild(creatureButton);

document.getElementById('labSaveCreature').onclick=()=>{
  if(!selected){
    flash('Select a creature first.');
    return;
  }
  savedCreatures.push(creatureSaveData(selected));
  persistSaved();
  savedSelected.clear();
  savedSelected.add(savedCreatures.length-1);
  renderSaved();
};

</script>
